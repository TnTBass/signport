plugins {
	id 'java-library'
}

version = rootProject.version
group = rootProject.group

base {
	archivesName = rootProject.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "Mojang"
		url = "https://libraries.minecraft.net"
	}
	maven {
		name = "NeoForged"
		url = "https://maven.neoforged.net/releases"
	}
}

sourceSets {
	main {
		java.setSrcDirs(["../src/commonClient/java", "../src/neoforge/java", "../src/neoforgeClient/java"])
		resources.setSrcDirs(["../src/neoforge/resources"])
	}
	test {
		java.setSrcDirs(["../src/neoforgeTest/java"])
		resources.setSrcDirs(["../src/neoforgeTest/resources"])
	}
}

dependencies {
	compileOnly rootProject.sourceSets.main.output
	compileOnly files(rootProject.sourceSets.main.compileClasspath)
	compileOnly files({ rootProject.configurations.clientCompileClasspath.files })
	compileOnly "net.neoforged:neoforge:${rootProject.neoforge_version}"
	compileOnly "net.neoforged.fancymodloader:loader:${rootProject.fancymodloader_version}"

	testImplementation rootProject.sourceSets.main.output
	testImplementation files(rootProject.sourceSets.main.compileClasspath)
	testImplementation files({ rootProject.configurations.clientCompileClasspath.files })
	testImplementation "net.neoforged:neoforge:${rootProject.neoforge_version}"
	testImplementation "net.neoforged.fancymodloader:loader:${rootProject.fancymodloader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:6.1.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.named("compileJava") {
	dependsOn rootProject.tasks.named("classes")
}

processResources {
	inputs.property "version", project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

tasks.named("jar") {
	archiveClassifier = "neoforge"
	from(rootProject.sourceSets.main.output) {
		exclude "tech/endorsed/signport/fabric/**"
		exclude "fabric.mod.json"
		exclude "signport.mixins.json"
	}
}
