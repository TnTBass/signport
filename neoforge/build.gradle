plugins {
	id 'java-library'
	id 'net.neoforged.moddev'
}

version = rootProject.version
group = rootProject.group

def displayVersionProvider = rootProject.ext.signPortDisplayVersionProvider

base {
	archivesName = "${rootProject.archives_base_name}-neoforge"
}

repositories {
	mavenCentral()
	maven {
		name = "Mojang"
		url = "https://libraries.minecraft.net"
	}
	maven {
		name = "NeoForged"
		url = "https://maven.neoforged.net/releases"
	}
}

sourceSets {
	main {
		java.setSrcDirs(["../src/common/java", "../src/commonClient/java", "../src/neoforge/java", "../src/neoforgeClient/java"])
		java.srcDir(rootProject.layout.buildDirectory.dir("generated/sources/buildInfo/java/main"))
		resources.setSrcDirs(["../src/common/resources", "../src/commonClient/resources", "../src/neoforge/resources"])
	}
	test {
		java.setSrcDirs(["../src/neoforgeTest/java"])
		resources.setSrcDirs(["../src/neoforgeTest/resources"])
	}
}

neoForge {
	version = rootProject.neoforge_version

	mods {
		signport {
			sourceSet sourceSets.main
		}
	}

	runs {
		server {
			server()
			gameDirectory = layout.projectDirectory.dir("run/server")
			loadedMods.add(mods.named("signport"))
		}
	}
}

dependencies {
	compileOnly rootProject.sourceSets.main.output
	compileOnly files(rootProject.sourceSets.main.compileClasspath)
	compileOnly files({ rootProject.configurations.clientCompileClasspath.files })
	// ModDev does not expose NeoForge to these custom source sets; keep explicit deps until source-set wiring is native.
	compileOnly "net.neoforged:neoforge:${rootProject.neoforge_version}"
	compileOnly "net.neoforged.fancymodloader:loader:${rootProject.fancymodloader_version}"

	testImplementation rootProject.sourceSets.main.output
	testImplementation files(rootProject.sourceSets.main.compileClasspath)
	testImplementation files({ rootProject.configurations.clientCompileClasspath.files })
	testImplementation "net.neoforged:neoforge:${rootProject.neoforge_version}"
	testImplementation "net.neoforged.fancymodloader:loader:${rootProject.fancymodloader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

java {
	withSourcesJar()
}

tasks.named("compileJava") {
	dependsOn rootProject.tasks.named("classes")
	dependsOn rootProject.tasks.named("generateBuildInfo")
}

tasks.named("sourcesJar") {
	dependsOn rootProject.tasks.named("generateBuildInfo")
}

processResources {
	inputs.property "displayVersion", displayVersionProvider
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "displayVersion": displayVersionProvider.get()
	}
}

tasks.named("jar") {
	exclude "tech/endorsed/signport/fabric/**"
	exclude "fabric.mod.json"
	exclude "signport.mixins.json"
}
