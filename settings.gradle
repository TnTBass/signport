pluginManagement {
	repositories {
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	// Settings plugin blocks can interpolate gradle.properties values; subproject plugin blocks cannot.
	id 'net.neoforged.moddev' version "${moddevgradle_version}" apply false
}

include 'neoforge'
