name: publish curseforge release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, for example 2.2.0+mc26.1.2'
        required: true
        type: string
      loader:
        description: 'Loader artifact to publish'
        required: true
        default: fabric
        type: choice
        options:
          - fabric
          - neoforge

permissions:
  contents: read

jobs:
  publish-curseforge:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: setup jdk
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 25
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew --quiet build
      - name: verify release artifact
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $loader = '${{ inputs.loader }}'
          $jar = if ($loader -eq "fabric") {
            "build/libs/signport-fabric-$version.jar"
          } else {
            "neoforge/build/libs/signport-neoforge-$version.jar"
          }
          if (-not (Test-Path -LiteralPath $jar)) {
            throw "Release artifact not found: $jar"
          }
      - name: extract public changelog notes
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $heading = "## $version"
          $capture = $false
          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in Get-Content -LiteralPath "CHANGELOG.md") {
            if ($line.StartsWith("## ")) {
              if ($capture) { break }
              if ($line.StartsWith($heading)) {
                $capture = $true
                continue
              }
            }
            if ($capture -and -not [string]::IsNullOrWhiteSpace($line)) {
              $notes.Add($line)
            }
          }
          if ($notes.Count -eq 0) {
            throw "No changelog notes found for $version"
          }
          $notes | Set-Content -LiteralPath "release-notes.md" -Encoding UTF8
      - name: publish curseforge release
        id: curseforge
        shell: pwsh
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          $version = '${{ inputs.version }}'
          $loader = '${{ inputs.loader }}'
          $jar = if ($loader -eq "fabric") {
            "build/libs/signport-fabric-$version.jar"
          } else {
            "neoforge/build/libs/signport-neoforge-$version.jar"
          }
          ./scripts/upload-curseforge.ps1 `
            -Slug "signport" `
            -Loader $loader `
            -Version $version `
            -JarPath $jar `
            -ChangelogPath "release-notes.md"
      - name: report curseforge file ID
        run: |
          echo "CurseForge file ID: ${{ steps.curseforge.outputs.curseforge_file_id }}"
