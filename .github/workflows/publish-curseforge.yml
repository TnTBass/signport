name: publish curseforge release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, for example 2.2.0+mc26.1.2'
        required: true
        type: string
      loader:
        description: 'Loader artifact to publish'
        required: true
        default: fabric
        type: choice
        options:
          - fabric
          - neoforge

permissions:
  contents: read

jobs:
  publish-curseforge:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: download released artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          MOD_LOADER: ${{ inputs.loader }}
        run: |
          $version = $env:RELEASE_VERSION
          $loader = $env:MOD_LOADER
          $directory = if ($loader -eq "fabric") { "build/libs" } else { "neoforge/build/libs" }
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download "v$version" --repo $env:GITHUB_REPOSITORY `
            --pattern "signport-$loader-$version.jar" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Could not download the released $loader artifact." }
      - name: verify release artifact
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $loader = '${{ inputs.loader }}'
          $jar = if ($loader -eq "fabric") {
            "build/libs/signport-fabric-$version.jar"
          } else {
            "neoforge/build/libs/signport-neoforge-$version.jar"
          }
          if (-not (Test-Path -LiteralPath $jar)) {
            throw "Release artifact not found: $jar"
          }
      - name: extract public changelog notes
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $heading = "## $version"
          $capture = $false
          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in Get-Content -LiteralPath "CHANGELOG.md") {
            if ($line.StartsWith("## ")) {
              if ($capture) { break }
              if ($line.StartsWith($heading)) {
                $capture = $true
                continue
              }
            }
            if ($capture -and -not [string]::IsNullOrWhiteSpace($line)) {
              $notes.Add($line)
            }
          }
          if ($notes.Count -eq 0) {
            throw "No changelog notes found for $version"
          }
          $notes | Set-Content -LiteralPath "release-notes.md" -Encoding UTF8
      - name: publish curseforge release
        id: curseforge
        shell: pwsh
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          $version = '${{ inputs.version }}'
          $loader = '${{ inputs.loader }}'
          $jar = if ($loader -eq "fabric") {
            "build/libs/signport-fabric-$version.jar"
          } else {
            "neoforge/build/libs/signport-neoforge-$version.jar"
          }
          ./scripts/upload-curseforge.ps1 `
            -Slug "signport" `
            -Loader $loader `
            -Version $version `
            -JarPath $jar `
            -ChangelogPath "changelogs/$version/$loader.md"
      - name: report curseforge file ID
        run: |
          echo "CurseForge file ID: ${{ steps.curseforge.outputs.curseforge_file_id }}"
